<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OTP Verification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2 id="verification_heading">Verify Your Account</h2>

        <p id="verification_subtext">
            We emailed you a six digit code. Please enter the code below to verify your account.
        </p>

        <div class="code-container">
            <input type="text" class="code" id="code-1" maxlength="1">
            <input type="text" class="code" id="code-2" maxlength="1">
            <input type="text" class="code" id="code-3" maxlength="1">
            <input type="text" class="code" id="code-4" maxlength="1">
            <input type="text" class="code" id="code-5" maxlength="1">
            <input type="text" class="code" id="code-6" maxlength="1">
        </div>

        <small>
            This is a design only. We don't actually send you an email.
        </small>
    </div>

    <script src="script.js"></script>
</body>
</html>
